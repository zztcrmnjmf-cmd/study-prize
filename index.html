<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff9fd">
<title>جائزتك وصلت! 🎀</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap');
:root{--ink:#604564;--pink:#f4b9d6;--violet:#dac8f7;--cream:#fff9fd}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;font-family:'Tajawal',Tahoma,Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 16% 14%,#ffe4f0 0,transparent 46%),radial-gradient(ellipse at 88% 90%,#e6deff 0,transparent 43%),#fff9fd;overflow-x:hidden}
main{position:relative;min-height:100svh;max-width:650px;margin:auto;display:flex;align-items:center;justify-content:center;padding:46px 20px 60px}
.card{width:100%;text-align:center;position:relative;padding:44px clamp(18px,5vw,38px) 38px;border:1.5px solid rgba(237,197,223,.7);border-radius:32px;background:rgba(255,255,255,.76);box-shadow:0 20px 65px #d7a8cb26,0 3px 20px #fff inset;backdrop-filter:blur(6px)}
.pill{display:inline-block;border-radius:100px;padding:9px 18px;background:#f8e4f0;color:#91698e;font-size:15px;font-weight:700;letter-spacing:.2px}
h1{font-size:clamp(29px,7vw,41px);letter-spacing:-.6px;margin:24px 0 9px;font-weight:800;color:#69476c}
.subtitle{font-size:clamp(16px,4.5vw,20px);margin:0 0 27px;line-height:1.8;color:#8e728f}
.note-wrap{position:relative;margin:6px auto 0;width:min(100%,450px)}
.note-button{position:relative;display:block;width:100%;padding:12px;border:0;border-radius:19px;background:linear-gradient(130deg,#fde4ef,#e6dfff);box-shadow:0 12px 30px #cc9fce55;cursor:pointer;transform:translateZ(0);transition:transform .18s,box-shadow .18s;-webkit-tap-highlight-color:transparent}
.note-button:hover{transform:translateY(-3px);box-shadow:0 16px 35px #cc9fce65}
.note-button:active{transform:scale(.975)}
.note-button:focus-visible{outline:3px solid #a88de9;outline-offset:4px}
.note-button img{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 3px 13px #73617836;user-select:none;pointer-events:none}
.tap{display:flex;align-items:center;justify-content:center;gap:9px;margin:27px 0 0;color:#7f5a80;font-weight:800;font-size:clamp(18px,4.6vw,22px)}
.tap .hand{display:inline-block;animation:tap 1.4s ease-in-out infinite}
@keyframes tap{50%{transform:rotate(-17deg) translateY(-5px)}}
.hint{font-size:13px;color:#ae92ac;margin:12px 0 0}
.emoji{position:absolute;font-size:24px;pointer-events:none;opacity:.75}.e1{top:20px;right:24px}.e2{left:21px;top:25px}.e3{right:25px;bottom:21px}.e4{bottom:18px;left:24px}
.result{display:none;transform:translateY(14px);opacity:0;margin-top:24px;background:#fff3fa;border:1.5px solid #f8d5e7;border-radius:22px;padding:23px 18px;box-shadow:0 10px 22px #ebc6e12c}
.result.show{display:block;animation:reveal .6s cubic-bezier(.2,.8,.25,1) forwards}
@keyframes reveal{to{opacity:1;transform:translateY(0)}}
.result .check{font-size:37px;line-height:1.2}.result h2{font-size:clamp(22px,6vw,30px);line-height:1.7;color:#86518e;margin:5px 0 8px}.result p{font-size:17px;color:#926d91;line-height:1.75;margin:0}
.again{border:0;background:transparent;color:#a17aa3;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:5px;cursor:pointer;padding:12px;margin-top:12px}
.particles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:10}
.particle{position:fixed;left:0;top:0;line-height:1;user-select:none;will-change:transform,opacity;animation:burst var(--dur) cubic-bezier(.13,.67,.28,.98) forwards;filter:drop-shadow(0 2px 1px #edafd14d)}
@keyframes burst{0%{transform:translate(var(--x),var(--y)) scale(.35) rotate(0);opacity:0}8%{opacity:1}65%{opacity:1}100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) scale(var(--scale)) rotate(var(--rot));opacity:0}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.035)}}
.note-button.boom{animation:bump .5s ease-out}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>

<div id="instruction" class="tap"><span class="hand">👆🏻</span> اضغطي عليها عشان تستلمين جائزتك</div>
<p class="hint" id="hint">لا تخافين، الفلوس ما تعض 💸</p>
<div class="result" id="result" role="status" aria-live="polite">
<div class="check">🎉✨</div>
<h2>تم إيداع ٥٠٠ ريال في حسابك الخيالي بنجاح!</h2>
<p>للأسف الرصيد غير قابل للسحب 😂<br>بس تستاهلين أكثر يا نجمة التحدي! 💗</p>
<button class="again" id="again" type="button">أعيدي الاحتفال ✨</button>
</div>
</section></main>
<script>
(function(){
 const claim=document.getElementById('claim');
 const again=document.getElementById('again');
 const result=document.getElementById('result');
 const instruction=document.getElementById('instruction');
 const hint=document.getElementById('hint');
 const particles=document.getElementById('particles');
 let ctx=null, last=0, timer=null;
 function rand(a,b){return Math.random()*(b-a)+a}
 function stars(){
  particles.replaceChildren();
  const r=claim.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const glyphs=['★','✦','✧','✶','✴','♡','✳'];
  const colors=['#f3b04c','#f5c3de','#d8bbff','#c8e5dd','#f3a5c9','#fff0a7','#fbd9a3'];
  for(let i=0;i<96;i++){
   const p=document.createElement('span');p.className='particle';
   const angle=rand(0,Math.PI*2),distance=rand(90,Math.min(window.innerWidth*.68,425));
   const x=cx+rand(-35,35),y=cy+rand(-35,35);
   p.textContent=glyphs[Math.floor(rand(0,glyphs.length))];
   p.style.color=colors[Math.floor(rand(0,colors.length))];
   p.style.fontSize=rand(14,31)+'px';
   p.style.setProperty('--x',x+'px');p.style.setProperty('--y',y+'px');
   p.style.setProperty('--dx',(Math.cos(angle)*distance)+'px');
   p.style.setProperty('--dy',(Math.sin(angle)*distance+rand(20,120))+'px');
   p.style.setProperty('--dur',rand(1.1,2.35)+'s');
   p.style.setProperty('--rot',rand(-800,800)+'deg');
   p.style.setProperty('--scale',rand(.5,1.25));
   particles.appendChild(p);
  }
  setTimeout(()=>particles.replaceChildren(),2800);
 }
 // Synthesized hand-clap effect: layered filtered noise, no downloads required.
 function applause(){
  try{
   const A=window.AudioContext||window.webkitAudioContext;
   if(!A)return;
   if(!ctx)ctx=new A();
   ctx.resume();
   const t=ctx.currentTime+.025;
   const buffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.085),ctx.sampleRate);
   const arr=buffer.getChannelData(0);
   for(let i=0;i<arr.length;i++)arr[i]=(Math.random()*2-1)*(1-i/arr.length);
   const master=ctx.createGain();master.gain.value=.31;master.connect(ctx.destination);
   for(let i=0;i<87;i++){
    const at=t+rand(0,2.65);const src=ctx.createBufferSource();src.buffer=buffer;
    src.playbackRate.value=rand(.7,1.45);
    const filter=ctx.createBiquadFilter();filter.type='bandpass';filter.frequency.value=rand(850,2200);filter.Q.value=rand(.5,1.4);
    const env=ctx.createGain();env.gain.setValueAtTime(.0001,at);
    env.gain.exponentialRampToValueAtTime(rand(.035,.18),at+.003);
    env.gain.exponentialRampToValueAtTime(.0001,at+rand(.035,.075));
    src.connect(filter).connect(env).connect(master);src.start(at);src.stop(at+.085);
   }
  }catch(e){/* Audio may be restricted; celebration remains visible */}
 }
 function celebrate(){
  clearTimeout(timer);result.classList.remove('show');result.style.display='none';
  claim.classList.remove('boom');void claim.offsetWidth;claim.classList.add('boom');
  applause();stars();
  instruction.style.display='none';hint.style.display='none';
  timer=setTimeout(()=>{result.style.display='block';void result.offsetWidth;result.classList.add('show');result.scrollIntoView({behavior:'smooth',block:'nearest'});},1700);
 }
 claim.addEventListener('click',celebrate);again.addEventListener('click',celebrate);
})();
</script>
